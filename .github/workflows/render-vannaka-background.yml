name: Render Vannaka Background

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/render-vannaka-background.yml"
      - "Images/Wiki/Vannaka.png"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pillow numpy opencv-python-headless

      - name: Prepare tiled Vannaka pattern at 2x resolution
        run: |
          mkdir -p output
          python - <<'PY'
          from PIL import Image, ImageFilter, ImageEnhance
          import numpy as np
          import cv2
          import math

          SOURCE = "Images/Wiki/Vannaka.png"
          W, H = 3840, 2160
          GAP = 130
          ICON_HEIGHT = 420

          source = Image.open(SOURCE)
          rgba_source = source.convert("RGBA")
          corners = [rgba_source.getpixel(p) for p in
                     [(0, 0), (source.width-1, 0),
                      (0, source.height-1), (source.width-1, source.height-1)]]
          print("Source mode:", source.mode, "size:", source.size, "corners:", corners)

          if source.mode in ("RGBA", "LA") or (source.mode == "P" and "transparency" in source.info):
              icon = source.convert("RGBA")
          else:
              rgb = np.array(source.convert("RGB"))
              if np.all(rgb[0, 0] >= 230):
                  candidate = np.all(rgb >= 230, axis=2)
                  bg_kind = "white"
              elif np.max(rgb[0, 0]) <= 18:
                  candidate = np.max(rgb, axis=2) <= 18
                  bg_kind = "black"
              else:
                  raise RuntimeError("RGB source has no clearly identifiable white/black background; refusing unsafe removal.")
              _, labels = cv2.connectedComponents(candidate.astype(np.uint8), connectivity=4)
              border_labels = np.unique(np.concatenate([labels[0, :], labels[-1, :], labels[:, 0], labels[:, -1]]))
              remove = np.isin(labels, border_labels)
              alpha = np.where(remove, 0, 255).astype(np.uint8)
              if bg_kind == "white":
                  brightness = np.min(rgb, axis=2)
                  fringe = (brightness > 200) & ~remove
                  fade = np.clip((230.0 - brightness) / 30.0, 0, 1)
              else:
                  brightness = np.max(rgb, axis=2)
                  fringe = (brightness < 45) & ~remove
                  fade = np.clip((brightness - 18.0) / 27.0, 0, 1)
              alpha[fringe] = (255 * fade[fringe]).astype(np.uint8)
              icon = Image.fromarray(np.dstack([rgb, alpha]), "RGBA")

          alpha = np.array(icon.getchannel("A"))
          ys, xs = np.where(alpha > 10)
          if len(xs) == 0:
              raise RuntimeError("Vannaka source has no visible pixels after transparency preparation.")
          icon = icon.crop((xs.min(), ys.min(), xs.max()+1, ys.max()+1))
          icon_w = max(1, round(icon.width * ICON_HEIGHT / icon.height))
          icon = icon.resize((icon_w, ICON_HEIGHT), Image.Resampling.LANCZOS)
          icon = ImageEnhance.Color(icon).enhance(0.80)

          blur, pad, ox, oy = 14, 42, 18, 18
          tile_w = icon.width + pad*2 + abs(ox)
          tile_h = icon.height + pad*2 + abs(oy)
          shadow_layer = Image.new("RGBA", (tile_w, tile_h), (0, 0, 0, 0))
          shadow_shape = Image.new("RGBA", icon.size, (0, 0, 0, 0))
          shadow_shape.putalpha(icon.getchannel("A").point(lambda a: 170 if a > 0 else 0))
          shadow_layer.alpha_composite(shadow_shape, (pad+ox, pad+oy))
          shadow_layer = shadow_layer.filter(ImageFilter.GaussianBlur(blur))
          shadow_layer.alpha_composite(icon, (pad, pad))

          S_x, S_y = tile_w + GAP, tile_h + GAP
          margin = GAP
          cols = int(math.ceil((W + S_x*2) / S_x)) + 2
          rows_n = int(math.ceil((H + S_y*2) / S_y)) + 2
          canvas_w = cols*S_x + margin*2
          canvas_h = rows_n*S_y + margin*2
          pattern = Image.new("RGBA", (canvas_w, canvas_h), (30, 40, 65, 255))
          for row in range(rows_n):
              for col in range(cols):
                  pattern.alpha_composite(shadow_layer, (margin + col*S_x, margin + row*S_y))
          pattern.convert("RGB").save("/tmp/vannaka-pattern-2x.png", optimize=True)
          with open("/tmp/vannaka-stride.txt", "w") as f:
              f.write(f"{S_x} {S_y} {margin}")
          print(f"Pattern canvas: {canvas_w}x{canvas_h}; icon: {icon.size}; stride: {S_x}x{S_y}; margin: {margin}")
          PY

      - name: Render 12-second seamless diagonal loop
        run: |
          python - <<'PY'
          import subprocess
          import cv2

          pattern_path = "/tmp/vannaka-pattern-2x.png"
          with open("/tmp/vannaka-stride.txt") as f:
              S_X, S_Y, MARGIN = map(int, f.read().split())

          pattern = cv2.imread(pattern_path, cv2.IMREAD_COLOR)
          if pattern is None:
              raise RuntimeError("Could not read prepared Vannaka pattern.")
          H, W = 2160, 3840
          out_w, out_h = 1920, 1080
          expected_frames = 720

          command = [
              "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
              "-f", "rawvideo", "-pix_fmt", "bgr24", "-s", f"{out_w}x{out_h}",
              "-r", "60", "-i", "-", "-an", "-c:v", "libx264",
              "-preset", "slow", "-crf", "18", "-pix_fmt", "yuv420p",
              "-t", "12", "-movflags", "+faststart", "output/Vannaka_Background.mp4"
          ]
          proc = subprocess.Popen(command, stdin=subprocess.PIPE)
          try:
              for n in range(expected_frames):
                  x = MARGIN + round(S_X * n / expected_frames)
                  y = MARGIN + round(S_Y * n / expected_frames)
                  crop = pattern[y:y+H, x:x+W]
                  if crop.shape[:2] != (H, W):
                      raise RuntimeError(f"Crop out of bounds on frame {n}: {crop.shape}")
                  frame = cv2.resize(crop, (out_w, out_h), interpolation=cv2.INTER_LANCZOS4)
                  proc.stdin.write(frame.tobytes())
                  if n % 120 == 0:
                      print(f"Rendered frame {n}/{expected_frames}")
              proc.stdin.close()
              result = proc.wait()
              if result != 0:
                  raise RuntimeError(f"FFmpeg encoder exited with status {result}")
          except Exception:
              if proc.poll() is None:
                  proc.kill()
              raise
          print("Rendered 720 frames at 1920x1080, 60 fps.")
          PY

      - name: Verify rendered video
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,pix_fmt -show_entries format=duration -of default=noprint_wrappers=1 output/Vannaka_Background.mp4

      - name: Commit rendered video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/Vannaka_Background.mp4
          if git diff --cached --quiet; then
            echo "No changes to the rendered video."
          else
            git commit -m "Render tiled Vannaka looping background"
            git push
          fi
