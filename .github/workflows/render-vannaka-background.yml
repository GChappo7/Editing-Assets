name: Render Tiled PNG Background

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: "Repository path to the PNG to tile"
        required: true
        default: "Images/Wiki/Vannaka.png"
        type: string
      background_color:
        description: "Background colour: auto or a hex value such as #243047"
        required: true
        default: "auto"
        type: string
  push:
    paths:
      - ".github/workflows/render-vannaka-background.yml"
      - "Images/Wiki/Vannaka.png"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_IMAGE: \${{ inputs.source_image || 'Images/Wiki/Vannaka.png' }}
      BACKGROUND_COLOR: \${{ inputs.background_color || 'auto' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pillow numpy opencv-python-headless

      - name: Prepare tiled image pattern and choose background
        run: |
          mkdir -p output
          python - <<'PY'
          from PIL import Image, ImageFilter, ImageEnhance
          import numpy as np
          import cv2
          import math
          import os
          import re
          from pathlib import Path

          SOURCE = os.environ["SOURCE_IMAGE"]
          REQUESTED_BG = os.environ.get("BACKGROUND_COLOR", "auto").strip()
          W, H = 3840, 2160
          GAP = 130
          ICON_HEIGHT = 420

          source_path = Path(SOURCE)
          if not source_path.is_file():
              raise FileNotFoundError(f"Source PNG not found: {SOURCE}")
          if source_path.suffix.lower() != ".png":
              raise RuntimeError("Please provide a PNG file.")
          output_path = Path("output") / f"{source_path.stem}_Background.mp4"
          output_path.parent.mkdir(parents=True, exist_ok=True)
          with open("/tmp/background-output-path.txt", "w") as f:
              f.write(str(output_path))

          source = Image.open(source_path)
          rgba_source = source.convert("RGBA")
          corners = [rgba_source.getpixel(p) for p in
                     [(0, 0), (source.width-1, 0),
                      (0, source.height-1), (source.width-1, source.height-1)]]
          print("Source:", SOURCE, "size:", source.size, "mode:", source.mode, "corners:", corners)

          if REQUESTED_BG.lower() == "auto":
              rgb = np.array(rgba_source.convert("RGB"))
              alpha = np.array(rgba_source.getchannel("A"))
              hsv = cv2.cvtColor(rgb, cv2.COLOR_RGB2HSV)
              # Give saturated, visible pixels the strongest vote; ignore near-grey pixels.
              mask = (alpha > 100) & (hsv[:, :, 1] > 45) & (hsv[:, :, 2] > 35)
              if np.count_nonzero(mask) > 20:
                  hist = np.bincount(
                      hsv[:, :, 0][mask].ravel(),
                      weights=(hsv[:, :, 1][mask].astype(np.float32) / 255.0),
                      minlength=180
                  )
                  dominant_hue = int(np.argmax(hist))
                  # A complementary hue, deliberately muted and dark, keeps the icon legible.
                  bg_hue = (dominant_hue + 90) % 180
                  bg_hsv = np.uint8([[[bg_hue, 72, 58]]])
                  bg_rgb = cv2.cvtColor(bg_hsv, cv2.COLOR_HSV2RGB)[0, 0]
                  bg = tuple(int(c) for c in bg_rgb)
              else:
                  bg = (36, 45, 57)  # Safe neutral slate for mostly monochrome artwork.
              print("Background mode: auto; selected RGB:", bg)
          else:
              match = re.fullmatch(r"#?([0-9a-fA-F]{6})", REQUESTED_BG)
              if not match:
                  raise RuntimeError("background_color must be 'auto' or a six-digit hex colour such as #243047.")
              hex_value = match.group(1)
              bg = tuple(int(hex_value[i:i+2], 16) for i in (0, 2, 4))
              print(f"Background mode: manual; selected #{hex_value.upper()} RGB: {bg}")

          if source.mode in ("RGBA", "LA") or (source.mode == "P" and "transparency" in source.info):
              icon = source.convert("RGBA")
          else:
              rgb = np.array(source.convert("RGB"))
              if np.all(rgb[0, 0] >= 230):
                  candidate = np.all(rgb >= 230, axis=2)
                  bg_kind = "white"
              elif np.max(rgb[0, 0]) <= 18:
                  candidate = np.max(rgb, axis=2) <= 18
                  bg_kind = "black"
              else:
                  raise RuntimeError("RGB source has no transparency and no clearly identifiable white/black background; refusing unsafe removal. Please use a transparent PNG.")
              _, labels = cv2.connectedComponents(candidate.astype(np.uint8), connectivity=4)
              border_labels = np.unique(np.concatenate([labels[0, :], labels[-1, :], labels[:, 0], labels[:, -1]]))
              remove = np.isin(labels, border_labels)
              alpha = np.where(remove, 0, 255).astype(np.uint8)
              if bg_kind == "white":
                  brightness = np.min(rgb, axis=2)
                  fringe = (brightness > 200) & ~remove
                  fade = np.clip((230.0 - brightness) / 30.0, 0, 1)
              else:
                  brightness = np.max(rgb, axis=2)
                  fringe = (brightness < 45) & ~remove
                  fade = np.clip((brightness - 18.0) / 27.0, 0, 1)
              alpha[fringe] = (255 * fade[fringe]).astype(np.uint8)
              icon = Image.fromarray(np.dstack([rgb, alpha]), "RGBA")

          alpha = np.array(icon.getchannel("A"))
          ys, xs = np.where(alpha > 10)
          if len(xs) == 0:
              raise RuntimeError("Source image has no visible pixels after transparency preparation.")
          icon = icon.crop((xs.min(), ys.min(), xs.max()+1, ys.max()+1))
          icon_w = max(1, round(icon.width * ICON_HEIGHT / icon.height))
          icon = icon.resize((icon_w, ICON_HEIGHT), Image.Resampling.LANCZOS)
          icon = ImageEnhance.Color(icon).enhance(0.80)

          blur, pad, ox, oy = 14, 42, 18, 18
          tile_w = icon.width + pad*2 + abs(ox)
          tile_h = icon.height + pad*2 + abs(oy)
          shadow_layer = Image.new("RGBA", (tile_w, tile_h), (0, 0, 0, 0))
          shadow_shape = Image.new("RGBA", icon.size, (0, 0, 0, 0))
          shadow_shape.putalpha(icon.getchannel("A").point(lambda a: 170 if a > 0 else 0))
          shadow_layer.alpha_composite(shadow_shape, (pad+ox, pad+oy))
          shadow_layer = shadow_layer.filter(ImageFilter.GaussianBlur(blur))
          shadow_layer.alpha_composite(icon, (pad, pad))

          S_x, S_y = tile_w + GAP, tile_h + GAP
          margin = GAP
          cols = int(math.ceil((W + S_x*2) / S_x)) + 2
          rows_n = int(math.ceil((H + S_y*2) / S_y)) + 2
          canvas_w = cols*S_x + margin*2
          canvas_h = rows_n*S_y + margin*2
          pattern = Image.new("RGBA", (canvas_w, canvas_h), (*bg, 255))
          for row in range(rows_n):
              for col in range(cols):
                  pattern.alpha_composite(shadow_layer, (margin + col*S_x, margin + row*S_y))
          pattern.convert("RGB").save("/tmp/tiled-pattern-2x.png", optimize=True)
          with open("/tmp/tiled-stride.txt", "w") as f:
              f.write(f"{S_x} {S_y} {margin}")
          print(f"Pattern canvas: {canvas_w}x{canvas_h}; icon: {icon.size}; stride: {S_x}x{S_y}; margin: {margin}; output: {output_path}")
          PY

      - name: Render 12-second seamless diagonal loop
        run: |
          python - <<'PY'
          import subprocess
          import cv2

          pattern_path = "/tmp/tiled-pattern-2x.png"
          with open("/tmp/tiled-stride.txt") as f:
              S_X, S_Y, MARGIN = map(int, f.read().split())
          with open("/tmp/background-output-path.txt") as f:
              output_path = f.read().strip()

          pattern = cv2.imread(pattern_path, cv2.IMREAD_COLOR)
          if pattern is None:
              raise RuntimeError("Could not read prepared tiled pattern.")
          H, W = 2160, 3840
          out_w, out_h = 1920, 1080
          expected_frames = 720

          command = [
              "ffmpeg", "-y", "-hide_banner", "-loglevel", "error",
              "-f", "rawvideo", "-pix_fmt", "bgr24", "-s", f"{out_w}x{out_h}",
              "-r", "60", "-i", "-", "-an", "-c:v", "libx264",
              "-preset", "slow", "-crf", "18", "-pix_fmt", "yuv420p",
              "-t", "12", "-movflags", "+faststart", output_path
          ]
          proc = subprocess.Popen(command, stdin=subprocess.PIPE)
          try:
              for n in range(expected_frames):
                  x = MARGIN + round(S_X * n / expected_frames)
                  y = MARGIN + round(S_Y * n / expected_frames)
                  crop = pattern[y:y+H, x:x+W]
                  if crop.shape[:2] != (H, W):
                      raise RuntimeError(f"Crop out of bounds on frame {n}: {crop.shape}")
                  frame = cv2.resize(crop, (out_w, out_h), interpolation=cv2.INTER_LANCZOS4)
                  proc.stdin.write(frame.tobytes())
                  if n % 120 == 0:
                      print(f"Rendered frame {n}/{expected_frames}")
              proc.stdin.close()
              result = proc.wait()
              if result != 0:
                  raise RuntimeError(f"FFmpeg encoder exited with status {result}")
          except Exception:
              if proc.poll() is None:
                  proc.kill()
              raise
          print(f"Rendered 720 frames at 1920x1080, 60 fps: {output_path}")
          PY

      - name: Verify rendered video
        run: |
          VIDEO_PATH="$(cat /tmp/background-output-path.txt)"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,pix_fmt -show_entries format=duration -of default=noprint_wrappers=1 "$VIDEO_PATH"

      - name: Commit rendered video
        run: |
          VIDEO_PATH="$(cat /tmp/background-output-path.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$VIDEO_PATH"
          if git diff --cached --quiet; then
            echo "No changes to the rendered video."
          else
            git commit -m "Render tiled background from $(basename "$SOURCE_IMAGE")"
            git push
          fi
